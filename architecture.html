/* ===== INTERACTIVE ARCHITECTURE LAB ===== */
.lab{padding:64px 0 70px;border-bottom:1px solid var(--line)}
.labHead{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:22px}
.labHead h2{margin-top:7px}
.labHint{max-width:500px;color:var(--muted);font-size:11px}
.labShell{border:1px solid var(--line2);border-radius:12px;background:#0e1115;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.24)}
.labBar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);background:#11151a}
.labStatus{display:flex;align-items:center;gap:9px;font:9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;color:var(--muted)}
.labDot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px rgba(215,255,100,.45)}
.labControls{display:flex;gap:7px;align-items:center}
.labBtn{height:31px;padding:0 10px;border:1px solid var(--line2);border-radius:5px;background:#151a20;color:var(--soft);font:9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;cursor:pointer}
.labBtn:hover,.labBtn.active{color:var(--accent);border-color:#596735}
.labBtn:disabled{opacity:.4;cursor:not-allowed}
.labCanvas{position:relative;padding:18px;background:
 radial-gradient(circle at 50% 45%,rgba(215,255,100,.035),transparent 35%),
 linear-gradient(#0e1115,#0e1115)}
.labSvg{display:block;width:100%;height:auto;min-height:390px}
.labSvg .node{fill:#151a20;stroke:#35404b;stroke-width:1.4;transition:.2s}
.labSvg .node.active{fill:#1a2115;stroke:#b4d858;filter:drop-shadow(0 0 8px rgba(215,255,100,.13))}
.labSvg .node.hot{stroke:var(--accent);filter:drop-shadow(0 0 12px rgba(215,255,100,.28))}
.labSvg .node.dim{opacity:.28}
.labSvg .flow{fill:none;stroke:#59636e;stroke-width:1.4;stroke-dasharray:5 6;marker-end:url(#arrow)}
.labSvg .flow.active{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 5;animation:flowMove .7s linear infinite}
.labSvg .flow.dim{opacity:.18}
.labSvg .wire{fill:none;stroke:#39434e;stroke-width:1.1}
.labSvg .label{fill:#e9edf1;font:600 13px Inter;letter-spacing:0;text-transform:none}
.labSvg .sub{fill:#7f8a96;font:9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;letter-spacing:.02em}
.labSvg .tiny{fill:#5f6a76;font:8px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.labSvg .chip{fill:#171d13;stroke:#566536;stroke-width:1}
.labSvg .chiptext{fill:#c9e968;font:8px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
.labSvg .token{fill:#d7ff64;opacity:.0}
.labSvg .token.run{opacity:1;animation:tokenTravel 2.1s linear infinite}
.labSvg .pulse{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:0}
.labSvg .pulse.run{animation:pulse 1.4s ease-out infinite}
@keyframes flowMove{to{stroke-dashoffset:-18}}
@keyframes pulse{0%{opacity:0;transform:scale(.96)}25%{opacity:.7}100%{opacity:0;transform:scale(1.08)}}
.labLegend{display:flex;gap:15px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font:8px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}

.labStep:hover{border-color:var(--line2);color:var(--soft)}.labStep.active{border-color:#58673a;background:#171d13;color:var(--accent)}
.labInfo{display:grid;grid-template-columns:1.25fr .75fr;border-top:1px solid var(--line)}
.labExplain{padding:18px 15px}.labExplain .k{color:var(--accent);font:8px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;text-transform:uppercase}.labExplain h3{margin:7px 0 5px;font:600 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.labExplain p{margin:0;color:var(--soft);font-size:11px}
.labParts{padding:18px 15px;border-left:1px solid var(--line)}.labParts b{display:block;font:9px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;color:var(--muted);margin-bottom:9px;text-transform:uppercase}.partList{display:flex;flex-wrap:wrap;gap:6px}.part{padding:5px 7px;border:1px solid var(--line2);border-radius:4px;color:var(--soft);font:8px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;cursor:default}.part:hover{color:var(--accent);border-color:#58673a}

@media(max-width:800px){.labHead{display:block}.labHint{margin-top:12px}.labInfo{grid-template-columns:1fr}.labParts{border-left:0;border-top:1px solid var(--line)}.labSteps{grid-template-columns:1fr 1fr}}

function map(x){
 const f=(x.family||"").toLowerCase(),c=(x.category||"").toLowerCase(),i=x.id;
 if(i.includes("mixture-of-experts")||f.includes("moe"))return moe(x.name);
 if(i.includes("retrieval")||i.includes("rag"))return rag(x.name);
 if(i.includes("diffusion"))return diffusion(x.name);
 if(i.includes("vision-transformer")||i==="vision-transformer")return vit(x.name);
 if(f.includes("vision-language")||i.includes("vision-language"))return vlm(x.name);
 if(f.includes("audio")||f.includes("speech")||i.includes("audio")||i.includes("speech"))return audio(x.name);
 if(i.includes("video"))return video(x.name);
 if(f.includes("token-free")||f.includes("byte")||i.includes("token-free")||i.includes("byte"))return tokenfree(x.name);
 if(i.includes("grouped-query"))return attention(x.name,"gqa");
 if(i.includes("multi-query"))return attention(x.name,"mqa");
 if(i.includes("sparse-attention"))return attention(x.name,"sparse");
 if(i.includes("linear-attention"))return attention(x.name,"linear");
 if(i.includes("attention"))return attention(x.name,"mha");
 if(i.includes("low-rank"))return adapt(x.name,true);
 if(i.includes("adapter"))return adapt(x.name,false);
 if(i.includes("quantized"))return quant(x.name);
 if(i.includes("agentic"))return agent(x.name,false);
 if(i.includes("tool-augmented"))return agent(x.name,true);
 if(i.includes("robotic"))return robot(x.name);
 if(i.includes("memory")||i.includes("long-context"))return memory(x.name);
 if(i.includes("state-space")||i==="mamba"||i==="rwkv"||f.includes("state space"))return ssm(x.name);
 if(i==="encoder-only-transformer"||f.includes("encoder-only"))return transformer("encoder",x.name);
 if(i==="decoder-only-transformer"||f.includes("decoder-only")||i==="causal-language-model"||i==="prefix-lm")return transformer("decoder",x.name);
 if(i==="encoder-decoder-transformer"||f.includes("encoder-decoder")||i==="denoising-sequence-to-sequence")return transformer("encdec",x.name);
 return transformer("decoder",x.name);
}

function labKind(x){
  const i=(x.id||"").toLowerCase(), f=(x.family||"").toLowerCase();
  if(i.includes("mixture-of-experts")||f.includes("moe")) return "moe";
  if(i.includes("retrieval")||i.includes("rag")) return "rag";
  if(i.includes("diffusion")) return "diffusion";
  if(i.includes("vision-transformer")||i==="vision-transformer") return "vit";
  if(i.includes("vision-language")||f.includes("vision-language")) return "vlm";
  if(i.includes("video")||f.includes("video")) return "video";
  if(i.includes("audio")||i.includes("speech")||f.includes("audio")||f.includes("speech")) return "audio";
  if(i.includes("state-space")||i==="mamba"||i==="rwkv"||f.includes("state space")) return "ssm";
  if(i.includes("sparse-attention")) return "sparse";
  if(i.includes("grouped-query")) return "gqa";
  if(i.includes("multi-query")) return "mqa";
  if(i.includes("linear-attention")) return "linear";
  if(i.includes("low-rank")) return "lora";
  if(i.includes("adapter")) return "adapter";
  if(i.includes("quant")) return "quant";
  if(i.includes("agentic")||i.includes("tool-augmented")) return "agent";
  if(i.includes("robotic")) return "robot";
  if(i.includes("memory")||i.includes("long-context")) return "memory";
  if(i==="encoder-only-transformer"||f.includes("encoder-only")) return "encoder";
  if(i==="encoder-decoder-transformer"||f.includes("encoder-decoder")||i.includes("denoising-sequence")) return "encdec";
  return "decoder";
}

function renderLab(x){
 const S=labSpec(x);
 return `<section class="lab"><div class="container">
   <div class="labHead"><div><div class="label">02 / Architecture in motion</div><h2>See how it works.</h2></div><div class="labHint">Move your pointer over components, then use the step controls to follow information flow through the architecture. The map is generated from this architecture's structural type.</div></div>
   <div class="labShell" id="architectureLab">
    <div class="labBar"><div class="labStatus"><span class="labDot"></span><span id="labState">INTERACTIVE / READY</span></div><div class="labControls"><button class="labBtn" id="labPlay">▶ Play</button><button class="labBtn" id="labPause">Ⅱ Pause</button><button class="labBtn" id="labReset">↻ Reset</button></div></div>
    <div class="labCanvas"><div class="labBadge">HOVER COMPONENTS</div><div id="labSvgWrap">${labSvg(x,0,false)}</div></div>
    <div class="labTimeline"><div class="timelineTop"><strong id="labStepTitle">${E(S.steps[0][0])}</strong><span id="labStepNo">01 / 05</span></div><div class="timeline"><div class="timelineFill" id="labFill"></div></div><div class="labSteps">${S.steps.map((s,i)=>`<button class="labStep ${i===0?"active":""}" data-step="${i}">${String(i+1).padStart(2,"0")} · ${E(s[0])}</button>`).join("")}</div></div>
    <div class="labInfo"><div class="labExplain"><div class="k">What is happening</div><h3 id="labExplainTitle">${E(S.steps[0][0])}</h3><p id="labExplainText">${E(S.steps[0][1])}</p></div><div class="labParts"><b>Architecture components</b><div class="partList">${S.parts.map(p=>`<span class="part" title="${E(p)}">${E(p)}</span>`).join("")}</div></div></div>
   </div>
 </div></section>`;
}

function bindLab(x){
 const root=document.getElementById("architectureLab"); if(!root)return;
 root.setAttribute("tabindex","0");
 const S=labSpec(x), wrap=document.getElementById("labSvgWrap"), fill=document.getElementById("labFill");
 const title=document.getElementById("labStepTitle"), no=document.getElementById("labStepNo"), exTitle=document.getElementById("labExplainTitle"), exText=document.getElementById("labExplainText"), state=document.getElementById("labState");
 let step=0, timer=null;
 function draw(){
   wrap.innerHTML=labSvg(x,step,!!timer);
   root.querySelectorAll(".labStep").forEach((b,i)=>b.classList.toggle("active",i===step));
   fill.style.width=`${step*25}%`; title.textContent=S.steps[step][0]; no.textContent=`${String(step+1).padStart(2,"0")} / 05`;
   exTitle.textContent=S.steps[step][0]; exText.textContent=S.steps[step][1];
   state.textContent=timer?"PLAYING / FLOWING":"INTERACTIVE / READY";
 }
 function go(n){step=Math.max(0,Math.min(4,n));draw()}
 root.querySelectorAll(".labStep").forEach(b=>b.addEventListener("click",()=>go(Number(b.dataset.step))));
 document.getElementById("labPlay").addEventListener("click",()=>{
   if(timer)return; timer=setInterval(()=>{if(step>=4){clearInterval(timer);timer=null;draw();return}step++;draw()},1500);draw();
 });
 document.getElementById("labPause").addEventListener("click",()=>{if(timer){clearInterval(timer);timer=null;draw()}});
 document.getElementById("labReset").addEventListener("click",()=>{if(timer){clearInterval(timer);timer=null}go(0)});
 wrap.addEventListener("mouseover",e=>{
   const g=e.target.closest("[data-part]"); if(!g)return;
   wrap.querySelectorAll("[data-part]").forEach(n=>n.classList.remove("hot"));
   g.classList.add("hot");
 });
 draw();
}
